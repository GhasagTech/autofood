<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شكراً — AutoFood</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Tajawal', sans-serif; background: #08080E; color: #F0EEE8; direction: rtl; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
  .card { max-width: 480px; }
  .icon { font-size: 4rem; margin-bottom: 1.5rem; }
  h1 { font-family: 'Cairo', sans-serif; font-size: 2.5rem; font-weight: 900; margin-bottom: 1rem; }
  p { color: #8A8AA0; line-height: 1.8; margin-bottom: 0.75rem; }
  .gold { color: #C9A84C; }
  .btn { display: inline-block; margin-top: 2rem; padding: 0.85rem 2rem; background: #C9A84C; color: #000; border-radius: 12px; font-weight: 700; font-size: 1rem; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1>تم التسجيل!</h1>
  <p>أهلاً بك في <span class="gold">AutoFood</span></p>
  <p>ستصلك رسالة على جوالك فور إطلاق التطبيق في حي الخليج.</p>
  <p class="gold">الإطلاق قريب جداً — كن جاهزاً 🚀</p>
  <a href="index.html" class="btn">العودة للرئيسية</a>
</div>
</body>
</html>
